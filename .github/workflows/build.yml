name: Build mars kernel (Droidspaces) for LineageOS/crDroid

# ============================================================
# 目标设备：Xiaomi Mi 11 Pro (mars / M2102K1AC)
# 当前 ROM：crDroid v11.2 (Android 15) — 基于 LineageOS 22
# 目标内核：5.4.286-qgki-g8252226d349c
#
# 设计要点（与社区 birdnofoots 那套的关键差异）：
#   1. 源码树用 LineageOS/android_kernel_xiaomi_sm8350，**不是** MIUI 内部树
#      —— 因为设备跑的是 LineageOS，vendor 模块的 vermagic 是
#        5.4.286-qgki-g8252226d349c，只有同一棵树才能复现。
#   2. **checkout 到确切的 commit 8252226d349c**（该 commit 的 SUBLEVEL=286）。
#   3. 创建空 .scmversion，抑制 setlocalversion 追加后缀，锁定 vermagic。
#   4. 只开 Droidspaces 官方 GKI 安全清单里的项。
#      **不打开** CFS_BANDWIDTH / CGROUP_PIDS（官方明确：破坏 kABI 且无补丁）。
#      **不关闭** CONFIG_MODVERSIONS（官方明确禁止）。
#   5. 打官方两个 kABI 补丁（SYSVIPC + POSIX_MQUEUE）。
#
# 变体：
#   ds        只加 Droidspaces 必需项 + kABI 补丁（最小改动，首选）
#   ds-verify 同上，但额外做完整校验（CRC 对照、配置断言）
#   baseline  完全不加任何东西、只重编原配置 —— 用来验证「工具链与树本身
#             能否产出可启动内核」，是排错的第一步
# ============================================================

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建变体'
        required: true
        type: choice
        default: 'baseline'
        options:
          - baseline
          - ds
          - ds-nolto
          - ds-nocfi
      lto:
        description: 'LTO 处理（设备内核是 LTO_CLANG=y + CFI_CLANG=y，clang 19 编的；用不同 clang 复现可能失败）'
        required: true
        type: choice
        default: 'as-is'
        options:
          - as-is      # 保持设备原配置（LTO+CFI 都开）
          - lto-thin   # 改 thin LTO（较易构建）
          - off        # 关 LTO+CFI（最易构建，但产物与设备 ABI 可能有差异）
      kernel_commit:
        description: '内核 commit（默认 8252226d349c，与设备 5.4.286 对应）'
        required: false
        default: '8252226d349c808968de74f98707a7a0051d8a5a'

env:
  ARCH: arm64
  UPSTREAM: https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git
  KCOMMIT: ${{ github.event.inputs.kernel_commit }}
  EXPECTED_RELEASE: '5.4.286-qgki-g8252226d349c'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    name: ${{ github.event.inputs.variant }}
    steps:
      - name: 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ccache bison flex libssl-dev libelf-dev bc python3 \
            python-is-python3 gperf device-tree-compiler libncurses-dev \
            rsync unzip ca-certificates lz4 xz-utils cpio zip time \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      # ── 工具链：用原厂同款 clang ────────────────────────────────
      # 设备内核是 clang 19.0.0 编的（见 /proc/version 的
      # "Android (12328485, +pgo, +bolt, +lto, +mlgo, based on r530567) clang version 19.0.0"）。
      # 但模块的 vermagic 不含编译器信息，所以工具链版本不影响模块加载。
      # 这里用 AOSP clang 尽量贴近，失败则退回 apt clang。
      - name: 安装 clang
        run: |
          set -uo pipefail
          DEST="$HOME/clang"; rm -rf "$DEST"; mkdir -p "$DEST"
          ok=0
          for d in clang-r487747c clang-r475365b clang-r450784d; do
            U="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${d}.tar.gz"
            echo "=== 尝试 $d"
            if curl -fsSL --retry 2 --connect-timeout 20 -o /tmp/clang.tgz "$U"; then
              tar -xzf /tmp/clang.tgz -C "$DEST" && [ -x "$DEST/bin/clang" ] && ok=1 && break
            fi
          done
          if [ "$ok" != 1 ]; then
            echo "::warning::AOSP prebuilt 失败，退回 apt clang-14"
            sudo apt-get install -y --no-install-recommends clang-14 lld-14
            mkdir -p "$DEST/bin"
            for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do
              b=${t%-14}
              [ -e "/usr/bin/${t}-14" ] && ln -sf "/usr/bin/${t}-14" "$DEST/bin/$b"
            done
            ok=1
          fi
          [ "$ok" = 1 ] || { echo "::error::找不到可用的 clang"; exit 1; }
          echo "$DEST/bin" >> $GITHUB_PATH
          "$DEST/bin/clang" --version | head -2

      - name: ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-lineage-${{ github.event.inputs.variant }}-${{ env.KCOMMIT }}-${{ github.run_id }}
          restore-keys: |
            ccache-lineage-${{ github.event.inputs.variant }}-${{ env.KCOMMIT }}-
            ccache-lineage-

      - name: 配置 ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=4G" >> $GITHUB_ENV
          echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
          echo "CCACHE_SLOPPINESS=time_macros,include_file_mtime" >> $GITHUB_ENV

      # ── 拉源码：必须全量 + 精确 checkout ──────────────────────
      - name: 拉取 LineageOS 内核源码
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$UPSTREAM" kernel
          cd kernel
          git checkout "$KCOMMIT"
          echo "KERNEL_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "=== Makefile 版本 ==="
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile
          # 关键：抑制 setlocalversion 追加 -g<hash>，同时手工补回期望后缀
          : > .scmversion
          echo "已清空 .scmversion"

      # ── kABI 补丁（baseline 不打）──────────────────────────────
      - name: 应用 Droidspaces kABI 补丁
        if: github.event.inputs.variant != 'baseline'
        run: |
          set -euo pipefail
          cd kernel
          # 用字符串精确匹配方式，而非 `patch -p1`：
          # 上游补丁行号基于不同的树（补丁说 @@ -1074，本树实际在 1077），
          # git apply 不容忍行号偏移；patch 命令在 CI 基础镜像里也不保证存在。
          # 本脚本只按内容匹配，并在匹配数不为 1 时硬失败，不做盲改。
          python3 ../tools/apply-kabi-patches.py .

          echo "=== kABI 补丁生效证据 ==="
          grep -n 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem)' include/linux/sched.h
          grep -n '_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7)' include/linux/sched.h
          grep -n 'ANDROID_KABI_USE(1, unsigned long mq_bytes)' include/linux/sched/user.h
          echo "✅ kABI 补丁全部生效（结构体布局未变，vendor 模块 CRC 不受影响）"

      # ── 构建 Droidspaces 配置片段 ─────────────────────────────
      - name: 生成配置片段并合并
        run: |
          set -euo pipefail
          cd kernel
          # 基于设备原厂完整配置（从备份 boot_a.img 提取，与 /proc/config.gz 零差异）
          cp ../configs/mars-stock-from-device.config arch/arm64/configs/vendor/mars_ds_defconfig
          DEF=vendor/mars_ds_defconfig

          # 直接生成 .config
          make O=out -j"$(nproc)" CC=clang LD=ld.lld ARCH=arm64 "$DEF"

          if [ "${{ github.event.inputs.variant }}" = "baseline" ]; then
            echo "=== baseline：不改任何配置 ==="
          else
            echo "=== 应用 Droidspaces GKI 安全配置（官方清单）==="
            scripts/config --file out/.config \
              -e SYSVIPC -e POSIX_MQUEUE -e IPC_NS -e PID_NS \
              -e DEVTMPFS -e NETFILTER_XT_MATCH_ADDRTYPE \
              -e USER_NS -e IP6_NF_NAT -e IP6_NF_TARGET_MASQUERADE \
              -e NETFILTER_XT_TARGET_REJECT -e NETFILTER_XT_TARGET_LOG \
              -e NETFILTER_XT_MATCH_RECENT \
              -e IP_SET -e IP_SET_HASH_IP -e IP_SET_HASH_NET -e NETFILTER_XT_SET \
              -e TMPFS_POSIX_ACL -e TMPFS_XATTR

            echo "=== 明确保持关闭（破坏 kABI，无补丁）==="
            scripts/config --file out/.config -d CFS_BANDWIDTH -d CGROUP_PIDS

            echo "=== 明确保持 MODVERSIONS 开启 ==="
            scripts/config --file out/.config -e MODVERSIONS
          fi

          # 锁定 vermagic 后缀（不依赖 git describe）
          scripts/config --file out/.config \
            --set-str LOCALVERSION "-qgki-g8252226d349c"
          scripts/config --file out/.config -d LOCALVERSION_AUTO

          # ── LTO / CFI 处理 ──────────────────────────────────
          # 设备内核实测：CONFIG_LTO_CLANG=y、CONFIG_CFI_CLANG=y，
          # 由 clang 19.0.0 (+pgo,+bolt,+lto,+mlgo) 编译。
          # CI 用不同 clang 版本复现 full LTO 常失败（内存/时间/版本敏感）。
          echo "=== LTO 策略：${{ github.event.inputs.lto }} ==="
          case "${{ github.event.inputs.lto }}" in
            off)
              scripts/config --file out/.config -d LTO_CLANG -d CFI_CLANG
              scripts/config --file out/.config -e LTO_NONE
              echo "已关闭 LTO 与 CFI"
              ;;
            lto-thin)
              scripts/config --file out/.config -e LTO_CLANG_THIN
              scripts/config --file out/.config -d LTO_CLANG_FULL
              echo "已切到 thin LTO"
              ;;
            *)
              echo "保持原样（LTO_CLANG=y + CFI_CLANG=y）"
              ;;
          esac

          make O=out -j"$(nproc)" CC=clang LD=ld.lld ARCH=arm64 olddefconfig

          echo "=== 关键配置断言 ==="
          for c in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS USER_NS \
                   TMPFS_XATTR NETFILTER_XT_MATCH_ADDRTYPE MODVERSIONS; do
            printf '  %-32s %s\n' "$c" "$(grep -m1 "^CONFIG_${c}=" out/.config || echo '未设置')"
          done
          for c in CFS_BANDWIDTH CGROUP_PIDS; do
            printf '  %-32s %s\n' "$c(必须关)" "$(grep -m1 "^CONFIG_${c}=" out/.config || echo '已关 ✓')"
          done
          printf '  %-32s %s\n' LOCALVERSION "$(grep -m1 '^CONFIG_LOCALVERSION=' out/.config)"
          printf '  %-32s %s\n' LOCALVERSION_AUTO "$(grep -m1 '^# CONFIG_LOCALVERSION_AUTO' out/.config || echo '未关 ✗')"

          echo "=== kernelrelease（必须等于 $EXPECTED_RELEASE）==="
          make -s O=out CC=clang LD=ld.lld ARCH=arm64 kernelrelease

      # ── 编译 ─────────────────────────────────────────────────
      - name: 编译内核
        run: |
          set +e
          cd kernel
          /usr/bin/time -v make -k O=out -j"$(nproc)" CC=clang LD=ld.lld ARCH=arm64 \
            KCFLAGS=-Wno-error KBUILD_MODPOST_WARN=1 > /tmp/build.log 2>&1
          rc=$?
          mkdir -p ../artifacts
          cp /tmp/build.log ../artifacts/build.log
          echo "make 退出码: $rc"
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "=================== BUILD FAILED ==================="
            grep -nE "error:|Error [0-9]+|No rule to make|undefined reference" /tmp/build.log | head -40
            tail -120 /tmp/build.log
            exit 1
          fi
          echo "✅ Image 已生成"
          ls -l out/arch/arm64/boot/Image

      # ── 校验产物 ──────────────────────────────────────────────
      - name: 校验产物（vermagic 与配置）
        run: |
          set -euo pipefail
          cd kernel
          IMG=out/arch/arm64/boot/Image
          mkdir -p ../artifacts
          cp out/.config ../artifacts/config.txt

          {
            echo "variant      : ${{ github.event.inputs.variant }}"
            echo "kernel_sha   : ${KERNEL_SHA}"
            echo "kernelrelease: $(make -s O=out CC=clang LD=ld.lld ARCH=arm64 kernelrelease)"
            echo "compiler     : $(clang --version | head -1)"
            echo "image_bytes  : $(stat -c%s $IMG)"
            echo "image_md5    : $(md5sum $IMG | cut -d' ' -f1)"
          } | tee ../artifacts/INFO.txt

          echo "=== ★ 内核版本串（决定 vendor 模块能否加载）==="
          strings "$IMG" | grep -oE '5\.4\.[0-9]+-qgki[a-z0-9-]*' | sort -u | head -5
          RELEASE=$(make -s O=out CC=clang LD=ld.lld ARCH=arm64 kernelrelease)
          echo "kernelrelease = $RELEASE"
          if [ "$RELEASE" != "$EXPECTED_RELEASE" ]; then
            echo "::error::kernelrelease 与设备不匹配！设备期望 $EXPECTED_RELEASE"
            echo "::error::这将导致 100 个 vendor 模块全部拒收 → 很可能 bootloop"
            exit 1
          fi
          echo "✅ kernelrelease 精确匹配设备"

          echo "=== 关键配置复核 ==="
          for c in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS MODVERSIONS; do
            v=$(grep -m1 "^CONFIG_${c}=y" out/.config || true)
            [ -n "$v" ] && echo "  ✅ $c" || echo "  ❌ $c 未开启"
          done
          grep -q '^CONFIG_CFS_BANDWIDTH=y' out/.config && echo "  ❌ CFS_BANDWIDTH 被打开了（危险）" || echo "  ✅ CFS_BANDWIDTH 已关"
          grep -q '^CONFIG_CGROUP_PIDS=y' out/.config && echo "  ❌ CGROUP_PIDS 被打开了（危险）" || echo "  ✅ CGROUP_PIDS 已关"

          echo "=== 内核 Image 头 ==="
          python3 - <<'PY'
          import struct
          b = open('out/arch/arm64/boot/Image','rb').read()
          print('size       ', len(b))
          print('code0      ', hex(struct.unpack_from('<I', b, 0)[0]))
          print('text_offset', hex(struct.unpack_from('<Q', b, 8)[0]))
          print('image_size ', struct.unpack_from('<Q', b, 16)[0])
          print('magic      ', b[56:60].decode('ascii', 'replace'))
          assert b[56:60] == b'ARMd', 'ARM64 魔数缺失'
          print('✅ 有效的 ARM64 Image')
          PY

          echo "=== kABI 符号 CRC 抽样（与 vendor 模块对照的基础）==="
          if [ -f out/Module.symvers ]; then
            for s in module_layout printk kmalloc_caches platform_driver_unregister; do
              printf '  %-32s %s\n' "$s" "$(grep -P "\t$s\t" out/Module.symvers | head -1 || echo '(未导出)')"
            done
            cp out/Module.symvers ../artifacts/Module.symvers
          fi

      # ── 打包 boot.img ────────────────────────────────────────
      - name: 打包 boot.img
        run: |
          set -euo pipefail
          cd kernel
          mkdir -p ../artifacts
          python3 ../tools/make-bootimg.py \
            ../ref/boot_a.img \
            out/arch/arm64/boot/Image \
            ../artifacts/boot-${{ github.event.inputs.variant }}.img
          ( cd ../artifacts && md5sum *.img | tee BOOT-IMGS.md5 )
          ls -la ../artifacts/

      - name: 提取内核符号表（供本地 CRC 对照）
        run: |
          cd kernel
          set +e
          for t in llvm-nm nm; do
            command -v "$t" >/dev/null 2>&1 && { NM="$t"; break; }
          done
          "$NM" -n out/vmlinux 2>/dev/null | head -5000 > ../artifacts/kallsyms-sample.txt
          echo "符号样本行数: $(wc -l < ../artifacts/kallsyms-sample.txt)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mars-${{ github.event.inputs.variant }}-${{ env.KERNEL_SHA }}
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: ccache 统计
        if: always()
        run: ccache --show-stats || true
